name: Build release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and refresh its release assets
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Package ${{ matrix.platform }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz
          - os: macos-latest
            platform: macos
            archive: tar.gz
          - os: windows-latest
            platform: windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --install build --prefix package
          cp LICENSE README.md package/
          tar -czf "rudy-sbom-delta-${{ matrix.platform }}.tar.gz" -C package .
      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package
          Copy-Item LICENSE, README.md -Destination package
          Compress-Archive -Path package\* -DestinationPath rudy-sbom-delta-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rudy-sbom-${{ matrix.platform }}
          path: rudy-sbom-delta-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish-assets:
    name: Attach checksummed release assets
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rudy-sbom-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum rudy-sbom-delta-* > SHA256SUMS
      - name: Verify release SHA-256 manifest
        run: python .github/scripts/release_checksums.py release-assets
      - name: Verify release archive integrity
        run: python .github/scripts/release_guard.py release-assets
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
